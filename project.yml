name: KitchenSyncApp
options:
  bundleIdPrefix: dev.ericdahl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  KitchenSyncApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/KitchenSyncApp
    # XcodeGen GENERATES this plist on every `xcodegen generate` — hand-edits to
    # Sources/KitchenSyncApp/Info.plist are overwritten. Add keys here instead.
    info:
      path: Sources/KitchenSyncApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without this, iOS runs the app letterboxed in legacy compatibility
        # mode at a smaller screen size. An empty dict is the modern opt-in.
        UILaunchScreen: {}
        # Bonjour/mDNS is gated behind the local network permission (iOS 14+).
        # Both keys are required: without them NWBrowser returns no results AND
        # URLSession cannot resolve `<host>.local` — silently, no useful error.
        # `_http._tcp` is what KitchenSyncDiscovery browses; the firmware
        # advertises no more specific service type (see T-011).
        NSLocalNetworkUsageDescription: KitchenSync finds your devices on the local network to show their status and control their MIDI clock.
        NSBonjourServices:
          - _http._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericdahl.kitchensync
        # Signing for on-device runs. Xcode manages the profile; this just names the team.
        # NOTE: on a real phone iOS will PROMPT for Local Network access on first launch.
        # Deny it and the app sees nothing at all — Bonjour browsing and `.local`
        # resolution both die silently, with no error to go on.
        DEVELOPMENT_TEAM: 5HR8E5CWR7
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        # The icon is DRAWN, not pasted: Tools/make_app_icon.swift renders
        # Assets.xcassets/AppIcon.appiconset/icon-1024.png from the same palette the
        # device's own web UI uses. Re-run it to change the art; don't hand-edit a PNG
        # nobody can regenerate.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KitchenSyncAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/KitchenSyncAppTests
    dependencies:
      - target: KitchenSyncApp
    settings:
      base:
        # A test bundle still has to be code-signed, which needs an Info.plist.
        # Letting Xcode synthesise one is the recommended route — there's nothing
        # in it worth hand-maintaining.
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  KitchenSyncApp:
    build:
      targets:
        KitchenSyncApp: all
        KitchenSyncAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KitchenSyncAppTests
